version: "3.8"

services:
  db:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: ein_soft_db_copy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Redis service for caching
  redis:
    image: redis:alpine
    container_name: ein_soft_redis_copy
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

# FastAPI Web Server
  web:
    build: .
    container_name: ein_soft_web_copy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./.env:/app/.env
      - ./tests:/app/tests
    expose:
      - "8000"
    env_file:          
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped


    # Celery worker for background tasks
  celery_worker:
    build: .
    container_name: ein_soft_celery_worker_copy
    command: celery -A src.workers.tasks.celery_app worker --loglevel=info
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    env_file:          
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - db 
      - redis
    restart: unless-stopped

    # Celery beat for scheduled tasks
  celery_beat:
    build: .
    container_name: ein_soft_celery_beat_copy
    command: celery -A src.workers.tasks.celery_app beat --loglevel=info
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - db
      - redis
    env_file:         
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: ein_soft_frontend_copy
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      - web

    restart: unless-stopped

# Nginx Reverse Proxy — single public entry point
  nginx:
    image: nginx:alpine
    container_name: ein_soft_nginx_copy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
